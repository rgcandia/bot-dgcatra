name: dgcatra

services:
  api:
    build: .
    container_name: dgcatra-api
    restart: always
    ports:
      - "4002:4002"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - dgcatra-session:/app/session

  db:
    image: postgres:16-alpine
    container_name: dgcatra-db
    restart: always
    environment:
      POSTGRES_USER: norbridge
      POSTGRES_PASSWORD: norbridge
      POSTGRES_DB: norbridge
    volumes:
      - dgcatra-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U norbridge -d norbridge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dgcatra-pgdata:
  dgcatra-session:
