name: dgcatra

services:
  api:
    build: .
    container_name: dgcatra-api
    restart: always
    ports:
      - "4002:4002"
    volumes:
      - ./.wwebjs_auth:/app/.wwebjs_auth
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      - CHROME_CRASHPAD_HANDLER=/dev/null
      - TZ=America/Argentina/Buenos_Aires
    shm_size: '2gb'
    dns:
      - 8.8.8.8
      - 1.1.1.1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    container_name: dgcatra-db
    restart: always
    environment:
      POSTGRES_USER: dgcatra
      POSTGRES_PASSWORD: dgcatra
      POSTGRES_DB: dgcatra
    volumes:
      - dgcatra-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dgcatra -d dgcatra"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dgcatra-pgdata:
